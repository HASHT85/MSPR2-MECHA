# ==============================================================================
# MSPR 2 MECHA — CI/CD Pipeline (GitHub Actions)
# ==============================================================================

name: MECHA CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # --------------------------------------------------------------------------
  # Job 1 : Lint — Analyse statique du code avec Ruff
  # --------------------------------------------------------------------------
  lint:
    name: 🔍 Lint (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer Ruff
        run: pip install ruff

      - name: Lancer Ruff (check)
        run: ruff check . --output-format=github

      - name: Lancer Ruff (format check)
        run: ruff format --check .

  # --------------------------------------------------------------------------
  # Job 2 : Tests — Tests unitaires & couverture avec pytest
  # --------------------------------------------------------------------------
  test:
    name: 🧪 Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    env:
      MODEL_PATH: models/saved_models
      DEFAULT_MODEL: random_forest
      PREDICTION_THRESHOLD: "0.5"

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------------
      # Reproductibilité de bout en bout ("test décisif") :
      # les données et les modèles ne sont pas versionnés (fichiers lourds),
      # ils sont régénérés à chaque exécution depuis les scripts du dépôt.
      # Les tests modèles / qualité données s'exécutent donc réellement en CI.
      # ------------------------------------------------------------------
      - name: Régénérer le jeu de données (simulation + fusion AI4I)
        run: |
          python data/scripts/generate_data.py
          python data/scripts/merge_datasets.py

      - name: Entraîner les modèles
        run: python models/training/train_models.py

      - name: Vérifier que l'API charge les modèles (pas de mode mock)
        run: |
          python - <<'EOF'
          from fastapi.testclient import TestClient
          from api.main import app, models
          with TestClient(app) as client:
              health = client.get("/health").json()
              print(health["models_available"])
              assert health["models_loaded"], models.load_errors
              assert all(health["models_available"].values()), models.load_errors
          EOF

      - name: Lancer les tests avec couverture
        run: |
          pytest \
            --cov=api \
            --cov=models \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term-missing \
            -v

      - name: Upload rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

      - name: Publier les modèles et métriques entraînés
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: |
            models/saved_models/*.joblib
            models/evaluation/results/*.json
          retention-days: 14

  # --------------------------------------------------------------------------
  # Job 3 : Build — Construction des images Docker
  # --------------------------------------------------------------------------
  build:
    name: 🐳 Build Docker
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        service:
          - name: api
            context: ./api
          - name: dashboard
            context: ./app

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: false
          load: true
          tags: mecha-${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Vérifier l'image ${{ matrix.service.name }}
        run: docker image inspect mecha-${{ matrix.service.name }}:${{ github.sha }}
